name: flutkit_ademin
description: "AI-Powered Flutter Dashboard UI Kit."
publish_to: 'none'
version: 1.0.4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  web: ^1.1.1
  collection: ^1.18.0
  desktop_drop: ^0.7.1
  dotted_border: ^3.1.0
  emoji_picker_flutter: ^4.5.3
  file_selector: ^1.1.0
  fleather: ^1.19.0
  flex_color_picker: ^3.6.0

  flutter_colorpicker: ^1.1.0
  flutter_form_builder: ^10.0.1
  flutter_gantt:
    path: third_party/flutter_gantt
  flutter_highlighting: ^0.9.0+11.8.0
  flutter_html: ^3.0.0-beta.2
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.4.0
  flutter_spinkit: ^5.2.1
  flutter_syntax_view: ^4.1.0
  font_awesome_flutter: ^11.0.0
  form_builder_validators: ^11.0.0
  fullscreen_window: ^1.1.0
  go_router: ^17.1.0
  google_fonts: ^8.0.1
  intl: ^0.20.2
  shared_preferences: ^2.3.1
  syncfusion_flutter_calendar: ^33.2.10
  syncfusion_flutter_charts: ^33.2.10
  syncfusion_flutter_core: ^33.2.10
  syncfusion_flutter_datagrid: ^33.2.10
  syncfusion_flutter_sliders: ^33.2.10
  timeline_list: ^0.1.1
  timelines_plus: ^2.0.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.8.0
  flutter_native_splash: ^2.4.6
  appflowy_board: ^0.1.2
  syncfusion_flutter_maps: ^33.2.10
  lottie: ^3.3.1
  syncfusion_flutter_gauges: ^33.2.10
  gauge_indicator: ^0.6.0
  mime: ^2.0.0
  material_symbols_icons: ^4.2867.0
  flutter_svg: ^2.2.3
  dotlottie_loader: ^0.0.5
  flutter_riverpod: ^3.3.1
  flutter_markdown_plus: ^1.0.7
  flutter_highlight: ^0.7.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl_utils: ^2.8.7
  flutter_launcher_icons: ^0.14.4
  msix: ^3.16.12
  

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/animations/
    - assets/maps/
    - assets/mds/documentation/
    - assets/mds/pages/

flutter_intl:
  enabled: true
  class_name: Lang 
  main_locale: en 
  arb_dir: lib/l10n 
  output_dir: lib/generated 

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo_light.png
  color_dark: "#212529"
  image_dark: assets/images/logo.png
  android_12:
    #image: assets/android12splash.png
    #color: "#42a5f5"
    #icon_background_color: "#111111"
    #image_dark: assets/android12splash-invert.png
    #color_dark: "#042a49"
    #icon_background_color_dark: "#eeeeee"
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/images/icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/icon.png"

msix_config:
  display_name: Flutter Ademin
  publisher_display_name: FlutKit.com
  identity_name: flutkit.suite.ademin
  msix_version: 1.0.0.0
  logo_path: assets/images/icon.png
  capabilities: internetClient

