<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutkit_ademin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>flutkit_ademin</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
      background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    #splash-container {
      position: fixed;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      width: min(500px, 90vw);
    }

    .logo {
      width: 140px;
      max-width: 70vw;
      height: auto;
      margin-bottom: 24px;
    }

    .loader {
      width: 28px;
      height: 28px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top: 4px solid #0d6efd;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    .loading-title {
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      margin-bottom: 8px;
      color: #333;
    }

    .loading-message {
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      color: #666;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #212529;
      }

      .loading-title {
        color: #fff;
      }

      .loading-message {
        color: #adb5bd;
      }

      .loader {
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top: 4px solid #4dabf7;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <div id="splash-container">
    <picture id="splash">
      <source
        srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x"
        media="(prefers-color-scheme: light)">
      <source
        srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x"
        media="(prefers-color-scheme: dark)">
      <img class="logo" src="splash/img/light-1x.png" alt="">
    </picture>

    <div class="loader"></div>

    <div class="loading-title">
      Preparing your dashboard...
    </div>

    <div class="loading-message">
      The initial load may take a little longer while application assets are downloaded and cached.
      Future visits will be significantly faster.
    </div>
  </div>

  <script>
    const buildHash = new Date().getTime();
    const script = document.createElement('script');
    script.src = "flutter_bootstrap.js?v=" + buildHash;
    script.type = "application/javascript";
    document.body.appendChild(script);
  </script>


</body>

</html>
